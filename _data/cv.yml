cv:
  name: Yixian Chen
  label: Research Scientist — Flood Inundation Mapping & Earth-Surface Processes
  email: ychen223@ua.edu
  location: Tuscaloosa, AL, USA
  image: ""
  summary: >
    Research scientist working across flood, erosion, landslide and infrastructure-failure
    hazards. Satellite-derived river slope datasets deployed as the first-priority input to
    NOAA's operational U.S. flood inundation mapping system. Principal investigator on
    competitive national research funding in both the United States and China.

  social_networks:
    - network: GitHub
      username: YixianChen-234
    - network: LinkedIn
      username: yixian-chen-765583166

  sections:
    Experience:
      - position: Research Scientist
        company: The University of Alabama — Surface Dynamics Modeling Lab
        location: Tuscaloosa, AL, USA
        url: https://sdml.ua.edu/
        start_date: 2026-04
        end_date: present
        highlights:
          - Lead PI on a $300,000 NOAA CIROH project selecting the optimal synthetic rating curve calibration for U.S. operational flood inundation mapping.
          - Initiated the project after establishing that improving a single model parameter in isolation unbalances an existing calibration and introduces new errors elsewhere.

      - position: Postdoctoral Fellow
        company: The University of Alabama — Surface Dynamics Modeling Lab
        location: Tuscaloosa, AL, USA
        url: https://sdml.ua.edu/
        start_date: 2024-05
        end_date: 2026-03
        highlights:
          - Diagnosed and replaced the poorly represented river slope layer in NOAA OWP HAND-FIM, the operational flood inundation mapping system of the United States.
          - Built the spatial joining framework that carries ICESat-2, SWOT and SWORD observations onto the operational river network.
          - Delivered a 31% average improvement in Critical Success Index across eight U.S. flood events; merged into NOAA-OWP/inundation-mapping as the first-priority slope source.
          - Maintain the national-scale HAND raster pipeline on AWS S3 supporting FIMserv.
          - Co-author on FIMeval and FIMbench, the evaluation and benchmark layers of the CIROH FIM ecosystem.

      - position: Postdoctoral Researcher
        company: Northwest University
        location: Xi'an, China
        start_date: 2021-03
        end_date: 2024-04
        highlights:
          - PI on an NSFC Young Scientist Project on the mechanisms by which valley bank gullies drive downslope valley erosion.
          - First-authored a complete catchment erosion budget after a 200-year rainstorm, finding that failed terraces and check dams were the second-largest sediment source at 33% of total erosion.

      - position: Postdoctoral Researcher
        company: KU Leuven
        location: Leuven, Belgium
        start_date: 2022-07
        end_date: 2023-06
        highlights:
          - First-authored the first global assessment of gully head density and susceptibility at 1 km² resolution, archived by the European Commission.
          - Generated the global training dataset from 17,499 sites interpreted from high-resolution satellite imagery; validated interpretation reliability at r² = 0.95.
          - Trained a 100-model random forest ensemble on HPC over 26 global predictor rasters, published with an explicit uncertainty layer.

